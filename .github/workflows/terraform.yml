name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read

concurrency:
  # infra/'s state file is a single shared resource — queue applies rather
  # than cancelling one mid-flight.
  group: terraform-apply
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_my_ip: ${{ secrets.TF_VAR_MY_IP }}
      TF_VAR_public_key_val: ${{ secrets.TF_VAR_PUBLIC_KEY_VAL }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.*"

      - name: terraform fmt
        run: terraform fmt -check -recursive
        # infra/vpc.tf and infra/ec2.tf predate this workflow and aren't
        # fmt-clean yet — don't block on pre-existing style debt unrelated
        # to this change. (Recommend a follow-up formatting-only PR.)
        continue-on-error: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Publish plan (PR only)
        if: github.event_name == 'pull_request'
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
